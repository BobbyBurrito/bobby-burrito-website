<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact – Bobby Burrito & Taco</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Bobby Burrito & Taco in Windsor for questions, feedback or catering.">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="top-banner">🌮 Taco Tuesday: Buy 2 Tacos, Get 1 FREE</div>
  <div class="header-inner container">
    <a class="brand" href="index.html">
      <img src="assets/images/logo.jpg" class="brand-logo">
      <span class="brand-text">Bobby Burrito & Taco</span>
    </a>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="container">
      <h1>Contact Us</h1>
      <p>We’d love to hear from you</p>
    </div>
  </section>

  <section class="section">
    <div class="container info-grid">
      <div class="info-block">
        <h2>Call Us</h2>
        <p><a href="tel:15199158488">519-915-8488</a></p>
      </div>

      <div class="info-block">
        <h2>Send a Message</h2>
        <form>
          <input type="text" placeholder="Name">
          <input type="email" placeholder="Email" required>
          <textarea placeholder="Message" required></textarea>
          <button class="btn" type="submit">Send</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-bottom">© 2025 Bobby Burrito & Taco</div>
</footer>

<script src="assets/js/script.js"></script>
</body>
</html>
